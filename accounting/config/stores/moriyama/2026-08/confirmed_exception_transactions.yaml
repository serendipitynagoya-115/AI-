# 確定済み社内例外取引マスター
#
# 通常は販売しない備品・消耗品等を、店舗が仕入れた原価のまま社内購入した例外取引を
# 明示登録する。商品マスター・原価マスターに存在しないことを異常として扱わず、
# classification="N"(社内例外取引)・severity="正常"として扱う。原価は税抜売上と
# 同額とし、粗利益0円として確定する。通常の商品マスター(product_price_history.yaml)
# には登録しない(通常販売品ではないため)。
#
# 推測で追加せず、オーナー・スタッフ確認(レシート確認等)により確定した行だけを
# 登録すること。今後、同じ商品が通常販売されるようになった場合は、その時点で
# 商品マスター(product_price_history.yaml)への登録が必要。
# (2026-09-15確定。accounting/docs/product-audit-spec.md §18参照)

exceptions:
  - store_id: moriyama
    year_month: "2026-08"
    date: "2026-08-24"
    row: 9
    product_name: とこちゃんベルト
    purchaser_type_override: 社内購入
    exception_type: 備品の社内購入(例外取引)
    note: >
      小川麻菜が出産祝いとして贈るため、店舗が施術時に使用する備品として仕入れている
      「とこちゃんベルト」(通常はお客様へ販売しない)を、原価のまま購入した例外取引。
      スタッフ確認・レシート確認により商品名を確定(2026-09-15、オーナー確認)。
      通常の商品マスターには登録しない。
