# 確定済みステータス上書きマスター
#
# 事実関係はオーナー確認により確定しているが、価格履歴・社割ルールマスターへの
# 正式登録がまだ済んでいない取引について、severityを「分類保留」に変更する。
# 通常はclassification(A〜K・S・N・X)自体は変更しない(推測で価格・原価を確定しない)。
# 「分類保留」は「正常」「既知差異」と同様に、要確認・重大エラーには含めない。
#
# 例外として、現場確認(スタッフ回答等)により価格異常自体が解消したと確定できたが、
# 対応する行がファイル内に見当たらず自動検出(detect_and_apply_shared_sales等)が
# 使えないケースに限り、new_classification・new_price_status・new_transaction_type・
# clear_flagsを追加で指定してclassification自体を上書きしてよい
# (product-audit-spec.md §19参照)。
#
# 推測で追加せず、オーナーが日報原本を確認して確定した行だけを登録すること。
# 対象商品を社割ルール(例:○%OFF)としてマスター登録するかどうかまでは、
# ここでは確定しない(別途の確認・マスター整備が必要)。
# (2026-09-15確定。accounting/docs/product-audit-spec.md §15参照)

overrides:
  - store_id: moriyama
    year_month: "2026-08"
    date: "2026-08-11"
    row: 4
    new_severity: 分類保留
    note: >
      小川麻菜本人のスタッフ購入と確定済み(2026-09-15オーナー確認)。通常価格8,800円・
      値引後5,280円(40%OFF相当)。コントアBクリームを社割対象商品(例:化粧品/Grant商品
      40%社割)としてマスター登録するかどうかは未確定のため、価格異常ではなく
      「スタッフ購入確定・社割ルール分類待ち」として保留する
      (accounting/CLAUDE.md「未設定・要確認の項目」参照)。
  # 2026-09-15訂正: 8/17行6(有機ほうじ茶パウダー)を単独でS(売上シェア確定)へ
  # 上書きする登録がここに存在したが、スタッフ回答を再確認した結果、行6は単独では
  # なく、行7(プロテイン)・行8(無・6,210円)と合わせた3行1組の売上シェアグループ
  # であったことが判明したため削除した。現在はconfirmed_manual_share_groups.yamlで
  # 3行まとめて扱う(product-audit-spec.md §21参照)。
  - store_id: moriyama
    year_month: "2026-08"
    date: "2026-08-10"
    row: 21
    new_severity: 分類保留
    note: >
      小川麻菜本人のスタッフ購入と確定済み(確定済み連続購入ブロック§12により購入者確定、
      2026-09-15オーナー確認)。通常価格8,030円・値引後4,818円(40%OFF相当)。
      「化粧品:スタッフ40%OFF」ルールの対象か商品マスター(基本情報シート)を確認したが、
      商品分類(化粧品等のカテゴリ)を示す列がそもそも存在せず、確認できなかった
      (推測でカテゴリを決めない)。このため、価格異常ではなく
      「スタッフ購入確定・社割ルール分類待ち」として保留する
      (accounting/CLAUDE.md「未設定・要確認の項目」参照)。
