# みよし店2026年8月の確定済み「既知構造差異」マスター
#
# 原因が既に特定済みだが、日報・月報集計の構造上の理由により解消できない
# (または意図的に解消しない)差異を登録する。差異そのものは消さず、
# 日報実績・月報集計・差額・原因はすべて保持したまま、「原因不明の店舗全体要確認」
# とは区別して「既知構造差異」として扱う(product-audit-spec.md §26参照)。
#
# 推測で登録せず、オーナー確認済みの原因だけを記録すること。

discrepancies:
  - store_id: miyoshi
    year_month: "2026-08"
    type: monthly_summary_staff_mapping_gap
    check: store_total_actual_sales
    expected_diff: 6119.44
    tolerance_yen: 1.0
    cause: >
      月報集計シートのスタッフ別集計列が「貞廣　乙稀」のままになっており、
      日報上の担当者「菅原　彩夏」の物販売上2件(合計6,119.44円、現在表示価格
      ベース)が、月報集計の店舗別列(担当スタッフ名簿に無い名前のため)から
      欠落している。日報側には正しく計上されているが月報集計側の店舗別内訳
      からは欠落しているという構造的な集計エラーであり、日報・月報集計どちらの
      数字も書き換えず、差額として保持する(2026-09-15/16オーナー確認)。
      価格履歴補正後の菅原彩夏の真の物販売上5,919.44円(プロテイン4,000円+
      マグネシウム1,919.44円)とは別の数字であり、混同しないこと
      (product-audit-spec.md §22参照)。
