# 確定済みステータス上書きマスター
#
# 事実関係はオーナー確認により確定しているが、価格差異そのものが解消したわけではない
# 取引について、severityやclassificationを変更する。推測で追加せず、オーナーが
# 日報原本を確認して確定した行だけを登録すること。
# (2026-09-15確定。accounting/docs/product-audit-spec.md §15参照。
#  mark_cost_unconfirmedの仕組みは2026-09-16確定、§26参照)

overrides:
  - store_id: nisshin_akaike
    year_month: "2026-08"
    date: "2026-08-03"
    row: 4
    new_classification: V
    new_severity: 注意
    new_price_status: 価格確定
    clear_flags: true
    mark_cost_unconfirmed: true
    note: >
      稲吉祐貴様「その他店販（標準税率）」税込35,200円(税抜32,000円)。
      オーナー確認により、非定番のグラント商品(在庫帳カテゴリ「グラント」・
      商品番号56)として実際に販売した正しい売上と確定した
      (2026-09-16オーナー確認)。商品マスター価格0円との不一致を価格異常とは
      せず、価格可変・非定番商品(セット料金と同種の運用。
      product-audit-spec.md §24参照)として扱う。実績売上35,200円(税込)/
      32,000円(税抜)はそのまま維持し、監査調整売上・ルール基準参考額の
      いずれにも置き換えない。ただし具体的な商品構成・原価はまだ確認できて
      いないため、原価0円(商品マスター登録値)を確定原価として扱わず、
      cost_confirmed=Falseとして原価未確認のまま保持する
      (売上確定≠原価確定≠粗利益確定。product-audit-spec.md §25・§26参照)。
      元Excelは修正していない。
