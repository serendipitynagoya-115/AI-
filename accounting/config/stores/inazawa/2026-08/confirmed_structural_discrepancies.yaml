# 稲沢店2026年8月の確定済み既知構造差異マスター
#
# 仕組みの説明は accounting/docs/product-audit-spec.md §26・§29 を参照。
# 原因は特定済みで、かつセル参照チェーンの追跡により補正額を決定論的に
# 復元できたケースについては、corrected_*フィールドに復元後の値を登録する
# (2026-09-16、product-audit-spec.md §29でセル参照チェーンを確認済み)。
# 元Excelは一切編集・再計算・保存していない。

discrepancies:
  - store_id: inazawa
    year_month: "2026-08"
    type: blank_treatment_course_vlookup_error
    check: store_total_actual_sales_unreadable
    cause: >
      日報8/22(シート「22」)行13、顧客名「東由加里」様、担当「スタッフ　１」、
      区分「既存」の取引で、コース内容(F列)が空欄のまま記録されている。
      現場確認(服部雄策様、2026-09-15)により、実際の施術内容は「整体（５回」
      (基本情報シートのコースマスターに登録済みの表記。5回券消化コース)
      だったことが確定した。F列が空欄のため`M13=VLOOKUP($F13,基本情報!
      $F$4:$H$55,3,FALSE)`が#N/Aとなり、これが日報側のU13・AC13・AH13、
      スタッフ1シートのAU7・AP16・AP7・J41・E1、月報集計シートのC5(実売実績)・
      C6(内回数券等)・C8(達成率)・I5・I6・I8、スタッフ集計シートのE1・E3・H1
      まで連鎖的に伝播し、店舗全体の実売実績が読み取れなくなっている。
    derivation: >
      決定論的復元(2026-09-16、product-audit-spec.md §29参照)。基本情報
      シートのコースマスターで「整体（５回」はG(施術単価)=8,000円・
      H(初回料金)=0円と登録されている。M13が参照するのはH列(=0円)であり、
      これは既存客の回数券消化コース(5回・15回問わずH=0)に共通する固定値
      である。稲沢店8月の日報全体で「整体（５回」「整体（15回」を選択した
      既存客の行(約80件)をすべて確認した結果、例外なくM・N・O・U・V・W列は
      すべて0円になっており(既に代金を回数券購入時に収受済みのため、消化時に
      追加売上を計上しない仕組みと判断できる)、この値は取引ごとの契約時期・
      残り回数等に依存しない静的なVLOOKUP定数である。したがって、F13に
      「整体（５回」を補完した場合もM13=0円・U13=0円・AC13=0円になることが
      確定的に導出できる(推測ではなく、同一パターンの網羅的一致と、数式が
      条件分岐を持たない静的VLOOKUPであることの2点から決定論的に導出)。
      この結果、スタッフ1シートの新規売系SUMIF(AP16)のみが#N/Aの汚染から
      解放され、他の全セル(既に正常な値)と合わせて以下のように再計算できる。
      日報1〜31日のAC・AD・AF直接合計(397,927.27円・409,836.36円・
      141,796.97円、合計949,560.61円)と、この復元値が完全に一致することを
      独立に確認済み(2026-09-16)。なお、AH13(=G列、施術単価8,000円)は
      別系統の「施術売」集計(スタッフ1シートL列)にのみ使われ、実売実績
      (E1・月報集計C5)の計算には一切含まれないことも数式追跡で確認済み。
    corrected_store_total_actual_sales: 949560.61
    corrected_ticket_treatment_sales_reported: 807763.64
    corrected_retail_sales_reported: 141796.97
