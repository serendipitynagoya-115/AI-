# 稲沢店 スタッフ・社内購入者の別名(alias)マスター(店舗固有)
#
# 目的・使い方は accounting/docs/product-audit-spec.md §10 を参照。
# 推測で別名を追加せず、オーナー確認済みのものだけを登録する。
#
# 稲沢店は基本情報シートの所属スタッフ欄(E4:E9)が外部リンク切れの
# テンプレート表記「スタッフ　１」〜「スタッフ　６」のまま残っており、
# 日報C列(担当)も同じ表記のみが使われている(実名の直接入力が無い)。
# このため、購入者区分判定(classify_purchaser)でスタッフ本人購入を検出できるよう、
# 実名から「スタッフ　１」「スタッフ　２」への対応を別名マスターとして登録する
# (2026-09-16オーナー確認。product-audit-spec.md §29参照)。

aliases:
  - alias: 服部雄策
    formal_name: "スタッフ　１"
    note: >
      稲沢店担当者本人(2026-09オーナー確認)。基本情報シートの所属スタッフ欄が
      外部リンク切れの「スタッフ　１」というテンプレート表記のままのため、
      実名との対応を別名マスターで解決する。
    source: "2026-09 オーナー確認(服部雄策様への現場確認を含む)"
  - alias: 櫻山貴雄
    formal_name: "スタッフ　２"
    note: >
      稲沢店担当者本人(2026-09オーナー確認)。基本情報シートの所属スタッフ欄が
      外部リンク切れの「スタッフ　２」というテンプレート表記のままのため、
      実名との対応を別名マスターで解決する。
    source: "2026-09 オーナー確認(服部雄策様への現場確認を含む)"
