# 確定済みステータス上書きマスター
#
# 事実関係はオーナー確認により確定しているが、価格差異そのものが解消したわけではない
# 取引について、severityを「注意」に変更する。classification(A〜K・S・N・X)自体は
# 変更しない(推測で価格・原価を確定しない)。
#
# 推測で追加せず、オーナーが日報原本を確認して確定した行だけを登録すること。
# (2026-09-15確定。accounting/docs/product-audit-spec.md §15参照)

overrides:
  - store_id: midori
    year_month: "2026-08"
    date: "2026-08-08"
    row: 6
    new_severity: 注意
    note: >
      日熊朝美本人のスタッフ購入と確定済み(確定済み連続購入ブロック§12により購入者確定、
      2026-09-15オーナー確認)。ドクターセレン（プロテイン）×2の実売(値引後・元帳):
      税込9,504円(税抜8,800円)。正式なスタッフ価格(4,320円×2=8,640円税込、税抜8,000円)
      との差額は税込864円(税抜800円)で、値引設定が不足していた入力・販売価格差異と
      オーナーが確認した。元帳売上(税込9,504円/税抜8,800円)はそのまま保持し、監査上の
      本来価格(税込8,640円/税抜8,000円)・価格差異(税込864円/税抜800円)は別数値として
      記録する(元Excelは修正しない)。社割ルール自体(4,320円)は既に
      config/global/staff_price_rules.yamlに登録済みであり、ルールの未確定ではなく
      個別取引の入力差異のため、分類保留ではなく注意として扱う。
