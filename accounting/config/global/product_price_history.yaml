# 商品価格履歴マスター(price history)
#
# 目的: 物販監査は「取引日時点で有効だった価格・原価」を使う(accounting/CLAUDE.md、
# accounting/docs/product-audit-spec.md 参照)。現在の商品マスター価格だけで過去取引を
# 監査すると、価格改定前の正常な取引が誤ってエラー判定されることがあるため、
# 商品ごとに「いつからいつまでこの価格だったか」を履歴として保持する。
#
# 各レコードのeffective_start_date〜effective_end_date(両端を含む)が、
# 取引日を含む場合にそのレコードを採用する。該当するレコードが無い場合は
# 「G. 価格履歴不足」として扱い、推測で埋めない。
#
# 現時点の全レコードは、守山店の日報「①8月.xlsx」基本情報シート(2026年8月分の
# スナップショット)から取得した実際の値であり、2026年8月の期間についてのみ
# 有効性を確認済み。8月より前・9月以降の期間は、別途確認できるまで
# レコードを追加しないこと(存在しない期間は価格履歴不足として検出させる)。
#
# ドクターセレン(マグネシウム)については、2026-09-11にオーナーから正式に
# 価格改定の情報(2026-09-01以降、通常価格+200円・仕入原価+100円)を受けている。
# ただし絶対額(いくらになるか)はまだ確定していないため、9月分のレコードは
# 追加していない。9月分のレコードが必要になった時点で、実際の新価格を
# 確認してから追加すること(推測で埋めない)。

