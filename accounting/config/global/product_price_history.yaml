  tax_rate: 1.08
  source: 日報①8月.xlsx 基本情報シート(2026-09-10/11取得、Google Driveミラー経由)
  notes: 2026-08-31までの旧価格として確定(2026-09-11オーナー確認、2026-09-12再確認)。2026-09-01以降は本ファイル下の新レコード(2026-09-01始期)を参照。
    【重要・2026-09-12判明】2026-09-10以降にDropboxから再取得した「①8月.xlsx」では、基本情報シートの表示価格が
    既に新価格(税込3,672円/税抜3,400円)へ更新されていることを確認した。8月中の全17件のマグネシウム販売実績
    (day2,6,8,9,16×2,17,18,20×2,22,26,27×2,29,30,31)も、値引前金額(P列)が例外なく3,672円で記録されている。
    しかし2026-09-12にオーナーへ確認した結果、2026-08-31までは旧価格3,456円(税込)/3,200円(税抜)が正式に
    確定した価格であり、「①8月.xlsx内の現在の表示価格3,672円」は9月への商品マスター更新後の"現在値"であって、
    8月当時の価格の証拠として使用しないことが明示された。物販監査は、この基本情報シートの現在表示値ではなく、
    本ファイル(取引日ベースの価格履歴)の有効期間で判定する(product-audit-spec.md §8参照)。
    したがって、8月のマグネシウム17件(一般顧客/区分不明16件・スタッフ1件)は、実売価格3,672円が本レコードの
    3,456円と一致しないため、「C:通常価格不一致」(スタッフ購入は「D:スタッフ価格不一致」)のまま要確認とする。
    現在の表示価格と一致することを理由に「正常」へ変更してはならない。
