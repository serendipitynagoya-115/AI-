# スタッフ・社内購入者の別名(alias)マスター
#
# 目的: 日報の「購入者」欄には、基本情報シートの担当スタッフ名簿と完全一致しない
# 表記(ひらがな表記、旧姓、オーナーの通称等)で記録されることがある。この場合、
# 単純な前方一致(classify_purchaser)では「一般顧客」「不明」と誤って扱われてしまう。
#
# ここに登録した別名(alias)は、正式氏名(formal_name)への対応として管理する。
# 別名に一致した購入者は、購入者区分を「スタッフ」(社内購入を含む)として扱う。
# 店舗の日報自身の担当スタッフ名簿(基本情報シート)に載っていない人物(オーナー等)
# であっても、ここに明示的に登録されていれば社内購入者として扱ってよい。
#
# 表記ゆれを吸収するのが目的であり、氏名の正式表記(formal_name)と別名(alias)は
# 分離して管理する。推測で別名を追加せず、オーナー確認済みのものだけを登録する。

aliases:
  - alias: オーナー
    formal_name: 辻正裕
    note: 社内購入(オーナー本人)
    source: 2026-09-13 オーナー確認(チャットでの正式連絡)
  - alias: ひらたえりか
    formal_name: 平田絵里可
    note: ''
    source: 2026-09-13 オーナー確認(チャットでの正式連絡)
  - alias: おぜきりか
    formal_name: 尾関リカ
    note: ''
    source: 2026-09-13 オーナー確認(チャットでの正式連絡)
  - alias: こたぎりけいこ
    formal_name: 小田切敬子
    note: 基本情報シートの担当スタッフ名簿に既存の人物(ひらがな表記のゆれ)
    source: 2026-09-13 オーナー確認(チャットでの正式連絡)
