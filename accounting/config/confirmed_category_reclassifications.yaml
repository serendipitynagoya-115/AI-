# 物販監査の対象から除外する、確定済みの区分振替マスター
#
# 物販監査(extract_retail_rows)は、日報の日別シートでK列(数量)・P列(値引前金額)の
# いずれかが入力されている行を、機械的に「物販の取引行」として抽出する。しかし
# 実際には、D・F・I列(既存/回数券欄)の記載から、施術・回数券(既存)側の売上で
# あって物販の商品購入ではないと判明する行が存在しうる。
#
# ここに明示登録した行は、物販監査(売上・原価・数量集計、価格・商品不明判定、
# 売上シェア判定のいずれも)から完全に除外し、施術/既存売上への振替として
# 別途出力する。物販総売上からその分だけ差し引かれるが、全体の現金・カード等の
# 入金額そのものは変わらない(単に集計上のカテゴリを訂正するだけ)。
#
# 推測で追加せず、オーナーが日報原本を確認して確定した行だけを登録すること。
# (2026-09-15確定。accounting/docs/product-audit-spec.md §14参照)

reclassifications:
  - store_id: moriyama
    year_month: "2026-08"
    date: "2026-08-17"
    row: 8
    tax_excl_revenue: 5750.0
    reclassified_as: 施術・回数券(既存)売上
    reason: >
      D列「既存」、F列「リンパ（5回」(回数券名)、I列「売上シェア」、J列「無」。
      同一会計(現金52,570円 = 行6 有機ほうじ茶パウダー270円 + 行7 プロテイン5,940円 +
      本行6,210円)の一部であり、物販の商品購入ではなく施術・回数券のシェア入力と
      2026-09-15にオーナーが日報原本を確認して確定。原価はこの行に付けない。
