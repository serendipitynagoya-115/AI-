# 現場確認に基づく手動確定・売上シェアグループマスター
#
# detect_and_apply_shared_sales(§11)の自動検出は、「1商品の商品あり行+その商品の
# 無行(1〜2行)」という単純な組み合わせだけを対象とする。しかし実際には、1つの
# 「無」行が複数の異なる商品の売上シェアを同時に受け止めているケースがあり、
# 自動検出では表現できない。
#
# ここに明示登録したグループは、_apply_confirmed_share と同じロジックで確定処理する
# (classification="S"・severity="正常"とし、「無」側の行のみ商品特定済み・原価0円・
# 数量0とする。商品あり側の行(product役割)は、日報記載どおりの数量・原価を
# そのまま使う=二重計上しない)。
#
# 推測で追加せず、現場確認(スタッフ回答等)により確定したグループだけを登録すること。
# (2026-09-15確定。accounting/docs/product-audit-spec.md §21参照)

groups:
  - store_id: moriyama
    year_month: "2026-08"
    date: "2026-08-17"
    rows: [6, 7, 8]
    linked_product: "有機ほうじ茶パウダー・ドクターセレン（プロテイン）(現場確認による売上シェア)"
    note: >
      現場確認(2026-09-15、スタッフ回答「①②とも小川さんと売上シェアの為、
      1行下に半額分入力してあります。金額の差異はありません。」)により確定。
      行6(有機ほうじ茶パウダー、実販売数量1個、通常価格540円の半額270円=澄川真側)、
      行7(ドクターセレン(プロテイン)、実販売数量2個、通常価格11,880円(5,940円×2個)の
      半額5,940円=澄川真側)、行8(無、6,210円=270円+5,940円の合計=小川麻菜側)の
      3行1組で、商品売上合計12,420円(540円+11,880円)を澄川真6,210円・
      小川麻菜6,210円に分配した売上シェア。日報K列「プロテイン数量2」は誤りではなく
      実際の販売数量どおり。商品原価は行6(350円・1個分)・行7(7,900円・2個分)の
      実販売数量分のみで計上し、行8には追加原価を付けない(二重計上防止)。
      当初、行7は「数量2は誤りで実際は1個」、行8は「施術(リンパ5回)側の売上」と
      誤って処理していたが、本グループ確定によりいずれも撤回する。
