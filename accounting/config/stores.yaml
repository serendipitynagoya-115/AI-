# 店舗マスタ(空テンプレート)
#
# 会計AIは、ここに登録された店舗名・別名以外の表記を「未登録」として扱い、
# 自動で同一店舗と判断してはいけません(accounting/CLAUDE.md 参照)。
#
# 各店舗について、正式名称・別名(表記ゆれ)・日報の所在を設定してください。
# source は日報が Google スプレッドシートの場合と Dropbox 上のファイルの場合の
# どちらもあり得るため、該当する方を記入してください。
#
# 記入例(値は仮のものです。実際のIDやパスに置き換えてください):
#
# stores:
#   - id: moriyama
#     official_name: "守山店"
#     aliases: ["守山", "Moriyama"]
#     source:
#       type: google_sheet   # google_sheet または dropbox
#       spreadsheet_id: ""   # type が google_sheet の場合
#       sheet_name: ""
#       dropbox_path: ""     # type が dropbox の場合

stores:
  - id: moriyama
    official_name: "守山店"
    aliases: ["守山", "守山店"]
    # store_type: direct(直営)/ franchise(FC)。2026-09-16、monthly accounting layer
    # (accounting/scripts/lib/monthly_accounting.py)向けに追加。将来のFCロイヤリティ
    # 計算等で使う想定だが、今回は属性として保持するのみで計算には使わない。
    store_type: direct
    # 2026-09-10 調査済み(読み取り専用の実地確認)。実売上・目標値などの数値は
    # ここには記録しない(会計数値をGit管理対象に含めない方針のため)。
    source:
      type: dropbox
      spreadsheet_id: ""
      sheet_name: ""
      dropbox_path: "/全店共有フォルダ/毎日報告資料/毎日報告/日報/新店舗/集計システム/2026年度/システム最新（守山店）"
      # 月ごとに1ファイル(例: 「①8月.xlsx」「②9月.xlsx」)。①②③は四半期グループの通し番号で、
      # 月そのものはファイル名の「◯月」部分で判断すること(番号だけで月を推測しない)。
      file_naming_pattern: "（丸数字）{月}月.xlsx"
      # 2026-09-10、Google Driveミラー(オーナーが手動コピー)経由でセル単位に解析した結果、
      # 「新規・既存・物販・累計(税抜)」の一次情報源は月報集計ではなく、日別シート(1〜31)の
      # AC列(新規売・税別)/AD列(回数券=既存売・税別)/AF列(物販・税別)/AG列(累計・税別)、
      # 特にその日の合計が入る54行目(AC54/AD54/AF54/AG54)であることが確定した。
      # 詳細な計算式・セル参照は accounting/docs/moriyama-sales-mapping.md を参照。
      primary_sheets:
        daily: "1〜31（日別シート。AC54/AD54/AF54/AG54が日合計・税抜)"
        monthly_crosscheck: "月報集計（実売実績・内物販の月合計の検算に使用。新規・既存を単独では区別しない)"
      other_sheets:
        - "基本情報（店舗目標・スタッフ一覧・コース/回数券単価・商品マスタ。税込/税別価格と税区分あり）"
        - "スタッフ1〜6（スタッフ個人別集計）"
        - "スタッフ集計"
        - "在庫帳（期首在庫・期末在庫・当月販売金額等）"
      # 2026-09-10、オーナーがDropbox原本をGoogle Driveへ読み取り専用ミラーとしてコピー(手動)。
      # このミラー経由でExcel原本をバイナリのまま取得し、セル座標付きで解析できることを確認済み
      # (accounting/docs/data-access-architecture.md 参照)。Dropboxが正本であり、両方とも書き換えない。
      google_drive_mirror:
        note: "オーナーによる手動コピー。自動同期ではない(2026-09-10時点)。"
        folder_id: "1HAB2-Nj6TiGC68a8NhA5pXegCWjHf0Sb"  # 2026年度/システム最新（守山店）
        file_id_202608: "169X5hWf5hCuo7qff7EXbabF2xXhGmF7p"  # ①8月.xlsx

  - id: miyoshi
    official_name: "みよし店"
    aliases: []
    store_type: direct
    source:
      type: ""
      spreadsheet_id: ""
      sheet_name: ""
      dropbox_path: ""

  - id: nisshin_akaike
    official_name: "日進赤池店"
    aliases: []
    store_type: direct
    source:
      type: ""
      spreadsheet_id: ""
      sheet_name: ""
      dropbox_path: ""

  - id: midori
    official_name: "緑店"
    aliases: []
    store_type: direct
    source:
      type: ""
      spreadsheet_id: ""
      sheet_name: ""
      dropbox_path: ""

  - id: kariya
    official_name: "刈谷店"
    aliases: []
    store_type: direct
    source:
      type: ""
      spreadsheet_id: ""
      sheet_name: ""
      dropbox_path: ""

  - id: inazawa
    official_name: "稲沢店"
    aliases: []
    # 稲沢店はFC(フランチャイズ)店舗(2026-09-16オーナー確認)。
    # FCロイヤリティ等の損益計算はmonthly accounting layerではまだ実装しない。
    store_type: franchise
    source:
      type: ""
      spreadsheet_id: ""
      sheet_name: ""
      dropbox_path: ""

# 転記先(正本)。実ファイルへの書き込みは必ず事前承認を得てから行うこと。
# 2026-09-10 時点でGoogle連携経由の読み取りを確認済み(書き込みは未実施)。
targets:
  sales_status_2026:
    description: "2026 売上現状"
    type: google_sheet
    spreadsheet_id: "1JgL9Td2zDhQ1Mcp1qrjACYo-vBOapYGnb-a7mB9LWu4"
    # シートは月ごとに分かれている(例: 「5月」「8月」)。年度は5月始まり4月締め。
    sheet_name_pattern: "{月}月"
    # 1シート内に全店舗のブロックが横並びになっている(店舗別の別シートではない)。
    # 店舗ブロックの並び順と、各ブロック内の列順を要確認欄なしで機械的に転記するための情報:
    store_block_order: ["守山店", "日進赤池店", "みよし店", "緑店", "刈谷店", "累計"]
    store_block_columns: ["新規", "既存", "物販", "累計"]
    # 稲沢店・岡崎店は上記ブロックとは別に、同シート内の別グループ(2ブロック目)に
    # 存在する可能性がある(2026-09-10時点で確認した範囲では明確な店舗名ラベルが
    # 取得できなかった箇所がある)。稲沢店を扱う際は改めて確認すること。

  store_pl_2026:
    description: "2026店舗収支"
    type: google_sheet
    spreadsheet_id: "1kMy8Am8Hw9epBSYpkeMXhnl4uH9q9rjo8oKG0JmtnGE"
    # 店舗ごとにシート(タブ)が分かれている。守山店は「守山」タブ。
    sheet_name_by_store:
      moriyama: "守山"
    # 会計年度は5月始まり4月締め(列: ５月,６月,７月,8月,9月,10月,11月,12月,1月,2月,3月,4月,計,今期目標)。
    # 行構成(確認済み・守山タブ): 施術売上/物販売上(店販・登録)/物販売上合計/売上合計/
    # 家賃/人件費(スタッフ別)/人件費合計/水道光熱費/ネット・電話/広告費(ホットペッパー・新聞折込・meta・PPC)/
    # 広告費合計/仕入れ/外注費/消耗品費/共通費/支出計/収支/共通費分配率/当月共通費/共通費計算後収支
    # 注意: シート内の見出しテキストは「Serendipity2025年度収支予想」のままで、
    # ファイル名の「2026」と年度表記が一致していない(要確認リスト参照)。
