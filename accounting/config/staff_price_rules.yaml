# 2026-09-11の守山8月再監査で、コントアBクリーム(化粧品と思われる)のスタッフ購入1件が
# 「値引後価格 = 通常価格 × 60%(40%OFF)」に一致することを検知したが、これが正式な
# 40%OFFルールの対象商品であるか、上記の社割価格表とは別枠の運用であるかは未確認のため、
# 推測でレコード化していない(価格履歴不足のまま)。対象商品リスト・端数処理ルールが
