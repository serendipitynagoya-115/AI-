# スタッフ価格(社割)履歴マスター
#
# 目的: スタッフが物販商品を購入した場合、通常価格ではなく社割価格が適用されることがある。
# この社割価格も、通常価格と同様に「取引日時点で有効だった価格」で判定する必要があるため、
# product_price_history.yaml とは別に、期間付きの履歴として管理する。
#
# 各商品のスタッフ価格は、次の2種類のいずれかで定義できる。
#
#   1. explicit_staff_price_incl_tax: 実額(税込)がそのまま社割価格表に明記されている場合。
#      正式ルール10により、この値がある商品はこの値を基準に監査する。
#
#   2. discount_percent: 「40%OFF」のように割合だけが定義されている場合(正式ルール11)。
#      社割価格 = 取引日時点で有効な通常販売価格(product_price_history.yaml より取得) × (1 - discount_percent)。
#      端数処理(四捨五入/切り捨て/切り上げ、税込/税別どちらの段階で丸めるか)は、
#      実際の社割価格表・過去の日報実績を確認してから正式ルール化する(正式ルール12)。
#      **現時点では端数処理ルールが未確定のため、discount_percent方式で計算した金額と
#      実際の取引価格を比較する監査は「I. 要現場確認」に分類し、A(正常)やD(スタッフ価格不一致)
#      を自動確定しない。**
#
# 該当するレコードが無い商品・期間は「G. 価格履歴不足」として扱い、推測で埋めない。
#
# 2026-09-11時点で確定しているのは、ドクターセレン(マグネシウム)の2026年8月分のみ。
# 他の商品(Grant商品・化粧品カテゴリ等、割合ベースの社割があるとされるもの)は、
# 対象商品リスト・割引率・端数処理ルールのいずれも未確認のため、レコードを追加していない。

staff_price_rules:
  - product_name: "ドクターセレン（マグネシウム）"
    effective_start_date: "2026-08-01"
    effective_end_date: "2026-08-31"
    rule_type: "explicit_staff_price_incl_tax"
    explicit_staff_price_incl_tax: 2073
    discount_percent: null
    rounding_rule: null
    source: "2026-09-11 オーナー確認(チャットでの正式連絡)"
    notes: "2026-09-01以降は新価格に伴い社割価格も変更される見込みだが、絶対額は未確認のためレコード未追加。"

# 割合ベースの社割(例: Grant商品・化粧品「40%OFF」)を追加する場合のレコード例(現時点ではダミー。
